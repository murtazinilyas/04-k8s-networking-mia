apiVersion: v1
kind: Service
metadata:
  name: mia-service
spec:
  ports:
    - name: nginx
      port: 9000
      protocol: TCP
      targetPort: 80
    - name: multitool
      port: 9001
      protocol: TCP
      targetPort: 8080
  selector:
    app: mia-deployment
  type: ClusterIP