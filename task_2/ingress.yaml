  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: mia-ingress
  spec:
    rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mia-frontend-svc
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: mia-backend-svc
              port:
                number: 80